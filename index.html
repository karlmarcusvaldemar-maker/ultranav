<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ultranav">
<meta name="theme-color" content="#16251c">
<title>Ultranav</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- Instrumentlist -->
  <header id="instruments">
    <button id="btnMenu" class="ibtn" aria-label="Meny"><i data-icon="menu" data-size="26"></i></button>
    <div class="inst"><span class="lbl">GS</span><span class="val" id="iGS">--</span><span class="unit" id="iGSu">kt</span></div>
    <div class="inst"><span class="lbl">TRK</span><span class="val" id="iTRK">---</span><span class="unit">°</span></div>
    <div class="inst"><span class="lbl">ALT</span><span class="val" id="iALT">----</span><span class="unit">ft</span></div>
    <div class="inst"><span class="lbl">AGL</span><span class="val" id="iAGL">----</span><span class="unit">ft</span></div>
    <div class="inst wide"><span class="lbl">NÄSTA</span><span class="val" id="iWP">—</span></div>
    <div class="inst"><span class="lbl">BRG</span><span class="val" id="iBRG">---</span><span class="unit">°</span></div>
    <div class="inst"><span class="lbl">DIST</span><span class="val" id="iDIST">--</span><span class="unit">NM</span></div>
    <div class="inst"><span class="lbl">ETE</span><span class="val" id="iETE">--:--</span></div>
    <div class="inst"><span class="lbl">ETA</span><span class="val" id="iETA">--:--</span><span class="unit">Z</span></div>
    <div class="inst"><span class="lbl">UTC</span><span class="val" id="iUTC">--:--</span></div>
  </header>

  <div id="mapwrap">
    <div id="map"></div>
    <div id="toast" class="hidden"></div>
    <div id="editBanner" class="hidden"><i data-icon="route"></i><span>Tryck på kartan för att lägga till brytpunkter. Dra en punkt för att flytta den.</span><button id="btnEditDone"><i data-icon="check" data-size="18"></i>Klar</button></div>

    <!-- Snabbknappar -->
    <nav id="fab" aria-label="Kartkontroller">
      <div class="grp">
        <button id="btnGps" title="GPS på/av"><i data-icon="gps"></i><small>GPS</small></button>
        <button id="btnFollow" title="Följ position"><i data-icon="follow"></i><small>Följ</small></button>
        <button id="btnOrient" title="Norr upp / kurs upp"><i data-icon="north"></i><small>Norr</small></button>
      </div>
      <div class="grp">
        <button id="btnEdit" title="Planera rutt"><i data-icon="route"></i><small>Rutt</small></button>
        <button id="btnDraw" title="Mät och rita"><i data-icon="ruler"></i><small>Mät</small></button>
        <button id="btnProfile" title="Terrängprofil"><i data-icon="mountain"></i><small>Profil</small></button>
      </div>
      <div class="grp">
        <button id="btnNearest" title="Närmaste flygfält"><i data-icon="runway"></i><small>Närmast</small></button>
        <button id="btnLayers" title="Kartlager"><i data-icon="layers"></i><small>Lager</small></button>
      </div>
      <div class="grp zoom">
        <button id="btnZoomIn" title="Zooma in" aria-label="Zooma in"><i data-icon="plus" data-size="24"></i></button>
        <button id="btnZoomOut" title="Zooma ut" aria-label="Zooma ut"><i data-icon="minus" data-size="24"></i></button>
      </div>
    </nav>

    <!-- Lagerpanel -->
    <section id="layerPanel" class="popover hidden"></section>

    <!-- Terrängprofil -->
    <section id="profilePanel" class="hidden">
      <canvas id="profileCanvas"></canvas>
      <div id="profileLegend"></div>
    </section>
  </div>

  <!-- Sidopanel -->
  <aside id="side" class="hidden">
    <div class="tabs">
      <button data-tab="route" class="active"><i data-icon="route"></i><span>Rutt</span></button>
      <button data-tab="wx"><i data-icon="cloud"></i><span>Väder</span></button>
      <button data-tab="fields"><i data-icon="plane"></i><span>Fält</span></button>
      <button data-tab="draw"><i data-icon="ruler"></i><span>Mät</span></button>
      <button data-tab="track"><i data-icon="log"></i><span>Logg</span></button>
      <button data-tab="settings"><i data-icon="sliders"></i><span>Inställn.</span></button>
      <button id="btnCloseSide" class="close" aria-label="Stäng"><i data-icon="close"></i></button>
    </div>
    <div class="tabbody" id="tab-route"></div>
    <div class="tabbody hidden" id="tab-wx"></div>
    <div class="tabbody hidden" id="tab-fields"></div>
    <div class="tabbody hidden" id="tab-draw"></div>
    <div class="tabbody hidden" id="tab-track"></div>
    <div class="tabbody hidden" id="tab-settings"></div>
  </aside>

  <!-- Modal -->
  <div id="modal" class="hidden"><div class="modalbox"><div id="modalBody"></div><div class="modalbtns"><button id="modalClose">Stäng</button></div></div></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet/leaflet-rotate.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
